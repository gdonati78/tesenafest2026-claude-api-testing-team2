# Source of truth for the repository labels, applied by .github/workflows/labels.yml.
# Labels not listed here are left alone, so renaming a label means adding the new one here
# and deleting the old one by hand.

# Type
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or improvement of the framework
- name: test-case
  color: 1d76db
  description: A test case to automate
- name: flaky-test
  color: fbca04
  description: A test that passes and fails without code changes
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: question
  color: d876e3
  description: Further information is requested
- name: smoke-failure
  color: b60205
  description: The hourly smoke run failed

# Priority (exactly one per issue)
- name: 'priority: critical'
  color: b60205
  description: P0 - blocks the team or CI, fix now
- name: 'priority: high'
  color: d93f0b
  description: P1 - needed for the current wave
- name: 'priority: medium'
  color: fbca04
  description: P2 - planned, not urgent
- name: 'priority: low'
  color: 0e8a16
  description: P3 - nice to have

# Area
- name: 'area: projects'
  color: c5def5
  description: Projects API
- name: 'area: tasks'
  color: c5def5
  description: Tasks API
- name: 'area: labels'
  color: c5def5
  description: Labels API
- name: 'area: comments'
  color: c5def5
  description: Comments API
- name: 'area: e2e'
  color: c5def5
  description: End-to-end scenarios across resources
- name: 'area: framework'
  color: c5def5
  description: Clients, fixtures, data builders, schemas, reporters
- name: 'area: ci'
  color: c5def5
  description: GitHub Actions workflows and git hooks

# Status
- name: needs-triage
  color: ededed
  description: Waiting for a maintainer to confirm type and priority
- name: blocked
  color: '000000'
  description: Waiting on something outside this issue

# Resolution
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: '008672'
  description: Extra attention is needed
